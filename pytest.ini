[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v 
    --headed 
    --browser chromium 
    --screenshot only-on-failure 
    --video retain-on-failure 
    --html=reports/reporte_qa.html 
    --self-contained-html
markers =
    security: Pruebas de seguridad y OWASP Top 10 (Payload-First / Zero Trust)
    functional: Pruebas funcionales de lógica de negocio
    auto_ready: Pruebas marcadas como Auto-Ready desde el protocolo QA
    regression: Pruebas de no-regresión
    [pytest]
    smoke: Pruebas críticas de humo (API/UI) rápidas.